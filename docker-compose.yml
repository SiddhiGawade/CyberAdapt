services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-api:
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/ml/artifacts/models/champion_model.joblib
      PREPROCESSOR_PATH: /app/ml/artifacts/models/preprocessor.joblib
      PORT: "5001"
      DEMO_MODE: "1"
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ml_state:/app/ml/artifacts/state
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:5001/health')); assert r.get('model_ready')"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/cyberadapt
      ML_API_URL: http://ml-api:5001
    depends_on:
      mongo:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  target:
    image: bkimminich/juice-shop:v17.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5055:3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  sensor:
    build:
      context: ./sensor
      dockerfile: Dockerfile
    network_mode: "service:target"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      target:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SENSOR_KEY: ${SENSOR_KEY:-}
      INGEST_URL: http://backend:5000/api/telemetry/ingest
      INTERFACE: eth0
      CAPTURE_FILTER: ip and port 3000
      BATCH_INTERVAL: "2"
      BATCH_SIZE: "10"
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "scripts/seed-dev.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/cyberadapt
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - tools

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - timeout
      - --signal=TERM
      - --kill-after=15s
      - 600s
      - zap-full-scan.py
      - -t
      - http://target:3000
      - -m
      - "1"
      - -T
      - "5"
      - -I
      - -r
      - /zap/wrk/zap-report.html
      - -J
      - /zap/wrk/zap-report.json
    volumes:
      - ./docker-reports:/zap/wrk:rw
    depends_on:
      target:
        condition: service_healthy
      sensor:
        condition: service_started
    profiles:
      - tools

  load-test:
    build:
      context: .
      dockerfile: server/Dockerfile
    entrypoint: ["node", "scripts/cyberadapt-local-load-test.js"]
    environment:
      CYBERADAPT_TARGET_URL: http://target:3000
      CYBERADAPT_ML_STATUS_URL: http://ml-api:5001/concept-drift
    depends_on:
      target:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    profiles:
      - tools

volumes:
  mongodb_data:
  ml_state:
